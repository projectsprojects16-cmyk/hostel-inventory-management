<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0d6efd,#6ea8fe);
  padding:20px;
  color:#fff;
}
h2{text-align:center}
.card{
  background:#ffffff;
  color:#000;
  padding:20px;
  border-radius:12px;
  margin:15px auto;
  max-width:400px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.btn-blue{background:#0d6efd;color:#fff}
.btn-green{background:#198754;color:#fff}
.btn-orange{background:#fd7e14;color:#fff}
.footer{text-align:center;margin-top:30px;font-size:13px;opacity:.9}
</style>
</head>
<body>

<h2>🏢 Administration Hostel Record</h2>

<div class="card">
  <button class="btn-blue" onclick="go('hostel.html')">➕ New Hostel Entry</button>
  <button class="btn-green" onclick="go('inventory.html')">📦 New Inventory Entry</button>
  <button class="btn-orange" onclick="alert('Edit / Update module coming next')">✏️ Edit / Update Records</button>
</div>

<div class="footer">
 Logged in as: <span id="user"></span>
</div>

<script>
function go(p){ location.href=p; }
document.getElementById("user").innerText =
  localStorage.getItem("entryBy") || "Admin";
</script>

</body>
</html>
