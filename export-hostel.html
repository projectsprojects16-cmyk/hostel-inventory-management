
<!DOCTYPE html>
<html>
<head>
<title>Hostel Employee Export</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;max-width:500px;margin:auto;box-shadow:0 10px 25px rgba(0,0,0,.1)}
h2{text-align:center}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
button{background:#4f46e5;color:#fff;border:none;font-size:16px}
.counter{font-weight:bold;text-align:center;margin:10px}
</style>
</head>
<body>
<div class="card">
<h2>Export Hostel Employees</h2>
<label>From Date</label>
<input type="date">
<label>To Date</label>
<input type="date">
<div class="counter">Total Entries: 0</div>
<button>Export to CSV</button>
</div>
</body>
</html>
