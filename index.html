<!DOCTYPE html>
<html>
<head>
<title>Login | Hostel App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f4f6f9;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#fff;padding:25px;border-radius:10px;width:300px;box-shadow:0 5px 15px rgba(0,0,0,.2)}
button{background:#0d6efd;color:#fff;border:none;padding:10px;width:100%;border-radius:6px}
input{width:100%;padding:8px;margin:8px 0}
</style>
</head>
<body>

<div class="card">
<h3>Login</h3>
<input id="name" placeholder="Your Name">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<script>
function login(){
  if(!name.value||!pass.value){
    alert("All fields required");
    return;
  }
  localStorage.setItem("entryBy", name.value);
  location.href="admin.html";
}
</script>
</body>
</html>
