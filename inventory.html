<!DOCTYPE html>
<html>
<head>
<title>Inventory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h2>Inventory Form</h2>
<input id="iname" placeholder="Item Name"><br><br>
<input id="qty" placeholder="Quantity"><br><br>
<input type="file" id="video" accept="video/*" capture><br><br>
<button onclick="save()">Save</button>

<script>
const SCRIPT_URL="PASTE_APPS_SCRIPT_URL";
function save(){
  let r=new FileReader();
  r.onload=()=>fetch(SCRIPT_URL,{
    method:'POST',
    body:JSON.stringify({
      action:'inventory',
      user:localStorage.getItem("user"),
      item:iname.value,
      qty:qty.value,
      vid:r.result
    })
  }).then(()=>alert("Saved"));
  r.readAsDataURL(video.files[0]);
}
</script>
</body>
</html>
