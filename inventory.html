<!DOCTYPE html>
<html>
<head>
  <title>Inventory Entry</title>
</head>
<body>

<h2>Inventory Form</h2>

<form id="inventoryForm">

<input id="itemName" placeholder="Item Name"><br><br>
<input id="category" placeholder="Category"><br><br>
<input id="quantity" placeholder="Quantity"><br><br>
<input id="condition" placeholder="Condition"><br><br>
<input id="location" placeholder="Location"><br><br>

<label>Video (Optional)</label><br>
<input type="file" id="video" accept="video/*"><br><br>

<button type="button" onclick="submitInventory()">Submit</button>

</form>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzE7jvsyf3ZiXUspwCtDeSvyCxf_adzMXeVriEyIEeAwWqeowmCIFYEiVdeqgKemEn0/exec";

function toBase64(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.readAsDataURL(file);
  });
}

async function submitInventory() {

  const data = {
    action: "inventory",
    itemName: itemName.value,
    category: category.value,
    quantity: quantity.value,
    condition: condition.value,
    location: location.value,
    entryBy: localStorage.getItem("entryBy")
  };

  if (video.files[0]) {
    data.videoBase64 = await toBase64(video.files[0]);
  }

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(res => {
    alert(res.message);
    inventoryForm.reset();
  })
  .catch(() => alert("Error"));
}
</script>

</body>
</html>
