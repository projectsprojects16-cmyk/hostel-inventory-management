<!DOCTYPE html>
<html>
<head>
<title>Hostel Employee</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h2>Hostel Employee Form</h2>
<input id="ename" placeholder="Employee Name"><br><br>
<input id="edesig" placeholder="Designation"><br><br>
<input type="file" id="photo" accept="image/*" capture><br><br>
<button onclick="save()">Save</button>

<script>
const SCRIPT_URL="PASTE_APPS_SCRIPT_URL";
function save(){
  let r=new FileReader();
  r.onload=()=>fetch(SCRIPT_URL,{
    method:'POST',
    body:JSON.stringify({
      action:'hostel',
      user:localStorage.getItem("user"),
      name:ename.value,
      desig:edesig.value,
      img:r.result
    })
  }).then(()=>alert("Saved"));
  r.readAsDataURL(photo.files[0]);
}
</script>
</body>
</html>
