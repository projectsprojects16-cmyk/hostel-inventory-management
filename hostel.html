<!DOCTYPE html>
<html>
<head>
  <title>Hostel Employee Form</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <h2>Hostel Employee</h2>
  <form id="hostelForm">
    <input name="empId" placeholder="Employee ID" required><br>
    <input name="name" placeholder="Name" required><br>
    <button type="submit">Submit</button>
  </form>

<script>
document.getElementById("hostelForm").onsubmit = async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  data.type = "hostel";
  await fetch("https://script.google.com/macros/s/AKfycbzE7jvsyf3ZiXUspwCtDeSvyCxf_adzMXeVriEyIEeAwWqeowmCIFYEiVdeqgKemEn0/exec", {
    method: "POST",
    body: JSON.stringify(data)
  });
  alert("Saved");
};
</script>
</body>
</html>
